name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: assistente_vampiro
          POSTGRES_USER: assistente_vampiro
          POSTGRES_PASSWORD: assistente_vampiro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistente_vampiro -d assistente_vampiro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://assistente_vampiro:assistente_vampiro_ci@127.0.0.1:5432/assistente_vampiro
      DATABASE_SCHEMA: assistente_vampiro
      DATABASE_POOL_MAX: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm security:audit

      - name: Run quality gates
        run: pnpm check

      - name: Test PostgreSQL migrations
        run: pnpm test:integration

  local-environment:
    name: Local PostgreSQL container
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet

      - name: Start local PostgreSQL
        run: docker compose --env-file .env.example up --detach --wait postgres

      - name: Verify PostgreSQL major version
        shell: bash
        run: |
          version="$(docker compose --env-file .env.example exec --no-TTY postgres sh -ec \
            'psql --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --tuples-only --no-align --command="show server_version;"' \
            | tr -d '[:space:]')"

          if [[ "$version" != 18.* ]]; then
            echo "::error::PostgreSQL 18 era esperado, mas o container informou $version."
            exit 1
          fi

      - name: Stop local PostgreSQL
        if: always()
        run: docker compose --env-file .env.example down --volumes
