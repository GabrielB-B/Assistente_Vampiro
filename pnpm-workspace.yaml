packages:
  - apps/*
  - database
  - packages/*

engineStrict: true
saveExact: true
sharedWorkspaceLockfile: true
strictPeerDependencies: true

# Correções transitivas de segurança enquanto os pacotes de origem não atualizam.
overrides:
  body-parser: 2.4.0
  multer: 2.5.0
  undici: 8.12.2
  zod: 4.6.7

catalog:
  typescript: 6.0.3
  vitest: 5.0.3
  eslint: 9.39.5
  "@types/node": 24.19.1

allowBuilds:
  esbuild: true
  pnpm: true
  unrs-resolver: true
patchedDependencies:
  "@next/eslint-plugin-next@16.4.2": patches/@next__eslint-plugin-next@16.4.2.patch
